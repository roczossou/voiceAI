# Blueprint Render — portfolio Chabel ANANOUNON
# Deux services : l'API/back-office Django et le site React. La base PostgreSQL
# est hébergée chez Neon (hors Render), branchée via la variable DATABASE_URL.
# Déploiement : Render → New → Blueprint → sélectionner ce dépôt.
# Les variables marquées `sync: false` ne sont PAS versionnées : Render les
# demande (ou les laisse vides) au moment de la création. Voir DEPLOY.md.

services:
  # ---------------------------------------------------------------- API Django
  - type: web
    name: chabel-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn --chdir back back.wsgi:application
    healthCheckPath: /api/services/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: false
      # Chaîne de connexion Neon (endpoint poolé), à coller dans le dashboard —
      # jamais dans le dépôt. En local elle est lue depuis backend/.env.
      - key: DATABASE_URL
        sync: false
      # Render redirige déjà http → https en amont ; la redirection applicative
      # ferait échouer le health check (requête interne sans X-Forwarded-Proto).
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: false
      # URL du site statique, à renseigner après le 1er déploiement
      # (ex. https://chabel-site.onrender.com, plus le domaine final ensuite).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      # Stockage des fichiers téléversés depuis le back-office. Sans cette
      # variable, ils atterrissent sur le disque éphémère de l'instance et
      # disparaissent au déploiement suivant.
      - key: CLOUDINARY_URL
        sync: false
      # Compte back-office créé au premier build (voir backend/build.sh).
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  # ------------------------------------------------------------- Site React
  - type: web
    name: chabel-site
    runtime: static
    region: frankfurt
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      # URL de l'API, à renseigner après le 1er déploiement de chabel-api
      # (ex. https://chabel-api.onrender.com — sans slash final).
      - key: VITE_API_URL
        sync: false
    routes:
      # SPA : react-router gère /projets, /a-propos… côté client, toutes les
      # routes profondes doivent donc renvoyer index.html (sinon 404 au
      # rechargement ou au partage d'un lien).
      - type: rewrite
        source: /*
        destination: /index.html
